      summary: Cancel a queued or running experiment
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '409': { $ref: '#/components/responses/Conflict' }
  /experiments/{id}/rerun:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Experiments]
      summary: Re-run with identical parameters and seed (reproducibility check)
      responses:
        '202': { $ref: '#/components/responses/Ok' }

